<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6b8e23" />
  <meta name="description" content="Playground profissional com editor, preview ao vivo e Supabase" />

  <title>Playground Profissional</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%236b8e23' width='192' height='192'/><text x='96' y='120' font-size='80' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>◆</text></svg>" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%236b8e23' width='192' height='192' rx='45'/><text x='96' y='120' font-size='80' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>◆</text></svg>" />

  <link rel="stylesheet" href="./css/theme.css" />

  <style>
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-size: 48px;
      color: var(--primary);
    }

    .header-content h1 {
      margin: 0;
      font-size: 28px;
      color: var(--text);
    }

    .header-content p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 12px;
      padding: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--panel);
    }

    .install-btn {
      display: none;
    }

    .install-btn.show {
      display: inline-flex;
    }

    .footer {
      margin-top: auto;
      padding: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .header {
        flex-direction: column;
        padding: 30px 15px;
      }

      .header-content h1 {
        font-size: 22px;
      }

      .nav {
        padding: 15px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="logo">◆</div>
      <div class="header-content">
        <h1>Playground Profissional</h1>
        <p>Editor de código com preview ao vivo, Supabase e PWA</p>
      </div>
    </header>

    <div id="status" class="status"></div>

    <nav class="nav">
      <a href="./playground.html" class="btn btn-primary">
        ▶ Playground
      </a>
      <a href="./editor.html" class="btn btn-secondary">
        ✎ Editor
      </a>
      <a href="./chat.html" class="btn btn-secondary">
        💬 Chat IA
      </a>
      <button id="installBtn" class="btn btn-secondary install-btn">
        ⬇ Instalar App
      </button>
      <button onclick="toggleTheme()" class="btn btn-secondary">
        ☾ Tema
      </button>
    </nav>

    <div class="footer">
      <p>v2.0.0 • PWA Instalável • Funciona Offline • Sincroniza com Supabase</p>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/sync.js"></script>

  <script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ Service Worker registrado'))
        .catch(err => console.error('❌ Erro ao registrar SW:', err));
    }

    // PWA Install
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.add('show');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      console.log(`Usuário respondeu: ${outcome}`);
      deferredPrompt = null;
      document.getElementById('installBtn').classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
      console.log('✅ App instalado com sucesso!');
      showStatus('success', 'App instalado! Você pode usá-lo offline.');
    });

    // Aplicar tema ao carregar
    applyTheme(CONFIG.theme);
  </script>
</body>

</html>
