const { useState } = React;

function App() {
  const [count, setCount] = useState(0);
  return (
    <div style={{textAlign:'center', padding:40, fontFamily:'sans-serif'}}>
      <h1 style={{color:'#6366f1'}}>React Playground ⚛️</h1>
      <div style={{fontSize:64, margin:'20px 0', fontWeight:'bold'}}>{count}</div>
      <button onClick={() => setCount(c=>c+1)}
        style={{background:'#6366f1',color:'white',border:'none',padding:'12px 24px',borderRadius:8,fontSize:16,cursor:'pointer',marginRight:8}}>
        +1
      </button>
      <button onClick={() => setCount(0)}
        style={{background:'#e2e8f0',border:'none',padding:'12px 24px',borderRadius:8,fontSize:16,cursor:'pointer'}}>
        Reset
      </button>
    </div>
  );
}
