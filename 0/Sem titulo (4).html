<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisador de Projetos - Modular</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; display: flex; height: 100vh; }
    
    #sidebar { width: 250px; background: #161b22; color: #e6edf3; overflow-y: auto; padding: 15px; border-right: 1px solid #30363d; }
    #main { flex: 1; display: flex; flex-direction: column; }
    
    #toolbar { background: #161b22; color: #e6edf3; padding: 15px; border-bottom: 1px solid #30363d; display: flex; gap: 10px; }
    #content { flex: 1; overflow-y: auto; padding: 20px; }
    
    button { background: #0066cc; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0052a3; }
    
    .tree-item { padding: 8px; cursor: pointer; border-radius: 3px; margin: 2px 0; }
    .tree-item:hover { background: #1c2128; }
    .tree-item.active { background: #1f6feb; color: white; }
    
    .section { background: white; padding: 15px; margin: 15px 0; border-radius: 5px; border-left: 5px solid #0066cc; }
    .section h3 { color: #0066cc; margin-bottom: 10px; }
    
    .code-block {
      background: #1e1e1e;
      color: #00ff00;
      padding: 10px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }
    
    input[type="file"] { padding: 8px; }
  </style>
</head>
<body>

<!-- SIDEBAR: Árvore de Arquivos -->
<div id="sidebar">
  <h3 style="margin-bottom: 15px;">📁 Estrutura</h3>
  <div id="tree"></div>
</div>

<!-- MAIN: Conteúdo -->
<div id="main">
  <!-- TOOLBAR: Botões -->
  <div id="toolbar">
    <input type="file" id="zip-input" accept=".zip" onchange="MODULO_IMPORTACAO.handleZip(event)">
    <button onclick="MODULO_ANALISE.analisarTudo()">🔍 Analisar</button>
    <button onclick="MODULO_EXPORTACAO.exportarRelatorio()">📤 Exportar</button>
  </div>

  <!-- CONTENT: Resultado -->
  <div id="content"></div>
</div>

<!-- ============================================ -->
<!-- MÓDULO 1: IMPORTAÇÃO (Ler ZIP) -->
<!-- ============================================ -->
<script>
const MODULO_IMPORTACAO = {
  arquivos: {},
  
  async handleZip(event) {
    const file = event.target.files[0];
    if (!file || !window.JSZip) return;
    
    try {
      const zip = await JSZip.loadAsync(file);
      this.arquivos = {};
      
      for (const [path, obj] of Object.entries(zip.files)) {
        if (!obj.dir) {
          this.arquivos[path] = await obj.async('string');
        }
      }
      
      console.log('✅ ZIP importado:', Object.keys(this.arquivos).length, 'arquivos');
      MODULO_INTERFACE.mostrarMensagem(`✅ ${Object.keys(this.arquivos).length} arquivos importados!`);
      MODULO_INTERFACE.renderizarArvore(this.arquivos);
      
    } catch (err) {
      MODULO_INTERFACE.mostrarMensagem('❌ Erro: ' + err.message, 'error');
    }
  }
};
</script>

<!-- ============================================ -->
<!-- MÓDULO 2: ANÁLISE (Detectar Estrutura) -->
<!-- ============================================ -->
<script>
const MODULO_ANALISE = {
  
  analisarTudo() {
    const arquivos = MODULO_IMPORTACAO.arquivos;
    if (!Object.keys(arquivos).length) {
      MODULO_INTERFACE.mostrarMensagem('❌ Nenhum arquivo importado!', 'error');
      return;
    }
    
    const mapa = this.gerarMapa(arquivos);
    const dependencias = this.detectarDependencias(arquivos);
    const backend = this.detectarBackend(arquivos);
    
    MODULO_INTERFACE.mostrarResultado(mapa, dependencias, backend);
  },
  
  gerarMapa(arquivos) {
    const estrutura = {};
    
    for (const path of Object.keys(arquivos)) {
      const partes = path.split('/');
      let atual = estrutura;
      
      for (let i = 0; i < partes.length; i++) {
        const parte = partes[i];
        if (i === partes.length - 1) {
          atual[parte] = { tipo: 'arquivo', tamanho: arquivos[path].length };
        } else {
          if (!atual[parte]) atual[parte] = {};
          atual = atual[parte];
        }
      }
    }
    
    return estrutura;
  },
  
  detectarDependencias(arquivos) {
    const deps = {};
    
    for (const [path, conteudo] of Object.entries(arquivos)) {
      deps[path] = {
        imports: this.extrairImports(conteudo),
        scripts: this.extrairScripts(conteudo),
        links: this.extrairLinks(conteudo),
        apis: this.extrairAPIs(conteudo)
      };
    }
    
    return deps;
  },
  
  extrairImports(conteudo) {
    const regex = /import\s+.*\s+from\s+['"]([^'"]+)['"]/g;
    const matches = [];
    let match;
    while ((match = regex.exec(conteudo))) {
      matches.push(match[1]);
    }
    return matches;
  },
  
  extrairScripts(conteudo) {
    const regex = /<script\s+src=['"]([^'"]+)['"]/g;
    const matches = [];
    let match;
    while ((match = regex.exec(conteudo))) {
      matches.push(match[1]);
    }
    return matches;
  },
  
  extrairLinks(conteudo) {
    const regex = /<link\s+.*href=['"]([^'"]+)['"]/g;
    const matches = [];
    let match;
    while ((match = regex.exec(conteudo))) {
      matches.push(match[1]);
    }
    return matches;
  },
  
  extrairAPIs(conteudo) {
    const regex = /fetch\(['"]([^'"]+)['"]/g;
    const matches = [];
    let match;
    while ((match = regex.exec(conteudo))) {
      matches.push(match[1]);
    }
    return matches;
  },
  
  detectarBackend(arquivos) {
    const backend = {
      apis: new Set(),
      bancos: new Set(),
      frameworks: new Set()
    };
    
    for (const conteudo of Object.values(arquivos)) {
      // Detectar APIs
      const apis = conteudo.match(/fetch\(['"]([^'"]+)['"]/g) || [];
      apis.forEach(api => backend.apis.add(api));
      
      // Detectar Bancos de Dados
      if (conteudo.includes('mongodb') || conteudo.includes('MongoDB')) backend.bancos.add('MongoDB');
      if (conteudo.includes('mysql') || conteudo.includes('MySQL')) backend.bancos.add('MySQL');
      if (conteudo.includes('firebase') || conteudo.includes('Firebase')) backend.bancos.add('Firebase');
      if (conteudo.includes('postgresql') || conteudo.includes('PostgreSQL')) backend.bancos.add('PostgreSQL');
      
      // Detectar Frameworks
      if (conteudo.includes('react')) backend.frameworks.add('React');
      if (conteudo.includes('vue')) backend.frameworks.add('Vue');
      if (conteudo.includes('angular')) backend.frameworks.add('Angular');
      if (conteudo.includes('express')) backend.frameworks.add('Express');
    }
    
    return {
      apis: Array.from(backend.apis),
      bancos: Array.from(backend.bancos),
      frameworks: Array.from(backend.frameworks)
    };
  }
};
</script>

<!-- ============================================ -->
<!-- MÓDULO 3: INTERFACE (Mostrar Resultado) -->
<!-- ============================================ -->
<script>
const MODULO_INTERFACE = {
  
  renderizarArvore(arquivos) {
    const tree = document.getElementById('tree');
    tree.innerHTML = '';
    
    const estrutura = {};
    for (const path of Object.keys(arquivos)) {
      const partes = path.split('/');
      let atual = estrutura;
      
      for (const parte of partes) {
        if (!atual[parte]) atual[parte] = {};
        atual = atual[parte];
      }
    }
    
    tree.innerHTML = this.renderizarNode(estrutura, '');
  },
  
  renderizarNode(obj, prefix = '') {
    return Object.keys(obj).map(key => {
      const isFolder = Object.keys(obj[key]).length > 0;
      const icon = isFolder ? '📁' : '📄';
      return `
        <div class="tree-item">
          ${icon} ${key}
        </div>
        ${isFolder ? '<div style="margin-left: 15px;">' + this.renderizarNode(obj[key], prefix + key + '/') + '</div>' : ''}
      `;
    }).join('');
  },
  
  mostrarResultado(mapa, dependencias, backend) {
    const content = document.getElementById('content');
    
    content.innerHTML = `
      <!-- SEÇÃO 1: MAPA -->
      <div class="section">
        <h3>🗺️ Estrutura do Projeto</h3>
        <div class="code-block">${JSON.stringify(mapa, null, 2)}</div>
      </div>
      
      <!-- SEÇÃO 2: DEPENDÊNCIAS -->
      <div class="section">
        <h3>🔗 Dependências Detectadas</h3>
        <div class="code-block">${JSON.stringify(dependencias, null, 2)}</div>
      </div>
      
      <!-- SEÇÃO 3: BACKEND -->
      <div class="section">
        <h3>⚙️ Backend Detectado</h3>
        <div class="code-block">${JSON.stringify(backend, null, 2)}</div>
      </div>
      
      <!-- SEÇÃO 4: RESUMO -->
      <div class="section">
        <h3>📊 Resumo</h3>
        <p>📁 Arquivos: ${Object.keys(MODULO_IMPORTACAO.arquivos).length}</p>
        <p>🔗 APIs: ${backend.apis.length}</p>
        <p>💾 Bancos: ${backend.bancos.join(', ') || 'Nenhum'}</p>
        <p>🛠️ Frameworks: ${backend.frameworks.join(', ') || 'Nenhum'}</p>
      </div>
    `;
  },
  
  mostrarMensagem(msg, tipo = 'success') {
    console.log(msg);
    alert(msg);
  }
};
</script>

<!-- ============================================ -->
<!-- MÓDULO 4: EXPORTAÇÃO (Gerar Relatório) -->
<!-- ============================================ -->
<script>
const MODULO_EXPORTACAO = {
  
  exportarRelatorio() {
    const arquivos = MODULO_IMPORTACAO.arquivos;
    if (!Object.keys(arquivos).length) {
      MODULO_INTERFACE.mostrarMensagem('❌ Nenhum arquivo para exportar!', 'error');
      return;
    }
    
    const relatorio = this.gerarRelatorio(arquivos);
    this.baixarArquivo(relatorio, 'relatorio-projeto.txt');
    MODULO_INTERFACE.mostrarMensagem('✅ Relatório exportado!');
  },
  
  gerarRelatorio(arquivos) {
    const mapa = MODULO_ANALISE.gerarMapa(arquivos);
    const deps = MODULO_ANALISE.detectarDependencias(arquivos);
    const backend = MODULO_ANALISE.detectarBackend(arquivos);
    
    let relatorio = `
RELATÓRIO DO PROJETO
====================

📊 RESUMO
---------
Total de arquivos: ${Object.keys(arquivos).length}
APIs detectadas: ${backend.apis.length}
Bancos de dados: ${backend.bancos.join(', ') || 'Nenhum'}
Frameworks: ${backend.frameworks.join(', ') || 'Nenhum'}

🗺️ ESTRUTURA
-----------
${JSON.stringify(mapa, null, 2)}

🔗 DEPENDÊNCIAS
---------------
${JSON.stringify(deps, null, 2)}

⚙️ BACKEND
----------
${JSON.stringify(backend, null, 2)}

📁 ARQUIVOS
-----------
${Object.keys(arquivos).map(f => `- ${f} (${arquivos[f].length} bytes)`).join('\n')}
    `;
    
    return relatorio;
  },
  
  baixarArquivo(conteudo, nome) {
    const blob = new Blob([conteudo], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
  }
};
</script>

</body>
</html>
