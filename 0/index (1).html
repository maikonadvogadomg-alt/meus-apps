<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SK Playground</title>
    <meta name="description" content="SK Playground — HTML, Python e React no navegador" />
    <script type="module" crossorigin src="./assets/app.js"></script>
  
  <!-- PWA: Gerado pelo PWA Builder -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#737322">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playground">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(r => console.log('[PWA] Service Worker registrado!', r.scope))
          .catch(e => console.error('[PWA] Erro:', e));
      });
    }
  </script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
