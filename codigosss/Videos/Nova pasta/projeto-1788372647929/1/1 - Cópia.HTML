    * {

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }

    .container {

    }

    .sidebar {
      width: 300px;
      background: #222;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: bold;
      color: #0088ff;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
      letter-spacing: 1px;
    }

    .menu-item {
      padding: 10px 12px;
      background: #333;
      margin: 4px 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .menu-item:hover {
      background: #444;
    }

    .menu-item.active {
      background: #0066cc;
      border-left-color: #0088ff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      overflow: hidden;
    }

    .header {
      padding: 16px;
      background: #222;
      border-bottom: 1px solid #333;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      color: #0088ff;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #0088ff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .check-item {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .check-status {
      font-size: 20px;
      min-width: 30px;
    }

    .check-content {
      flex: 1;
    }

    .check-name {
      font-weight: bold;
      color: #e0e0e0;
      margin-bottom: 4px;
    }

    .check-desc {
      font-size: 11px;
      color: #999;
    }

    .check-ok {
      color: #6bff6b;
    }

    .check-err {
      color: #ff6b6b;
    }

    .check-warn {
      color: #ffff6b;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-size: 24px;
      font-weight: bold;
      color: #0088ff;
    }

    .stat-label {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
    }

    .code-block {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 11px;
      color: #88ff88;
      line-height: 1.6;
    }

    .box {
      background: #333;
      border-left: 4px solid #0088ff;
      padding: 12px;
      border-radius: 4px;
      margin: 12px 0;
    }

    .box-title {
      font-weight: bold;
      color: #0088ff;
      margin-bottom: 6px;
    }

    .btn {
      padding: 8px 12px;
      background: #0066cc;
      border: 1px solid #0088ff;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #0077dd;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #222;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    function loadCheck(checkId) {
      const check = checks[checkId];
      
      document.getElementById('pageTitle').textContent = check.title;
      document.getElementById('pageContent').innerHTML = check.content;

      // Update active menu item
      document.querySelectorAll('.menu-item').forEach(item => {
        item.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
